<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Big Boss · Command Center — Tech House</title>
  <meta name="description" content="Big Boss Command Center — a surveillance-style control room for the Tech House: contestants, leaderboard, tasks, points, captaincy, nominations, immunity, the Danger Zone, announcements, timer, statistics and evictions." />
  <meta name="theme-color" content="#05070d" />
  <meta name="color-scheme" content="dark" />

  <meta property="og:title" content="Big Boss · Command Center" />
  <meta property="og:description" content="Mission-control dashboard for the Tech House reality show. Big Boss is watching." />
  <meta property="og:type" content="website" />

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070d'/%3E%3Cpath d='M16 8c-4.2 0-7.4 3-8.6 8 1.2 5 4.4 8 8.6 8s7.4-3 8.6-8c-1.2-5-4.4-8-8.6-8zm0 11.5A3.5 3.5 0 1 1 16 12.5a3.5 3.5 0 0 1 0 7z' fill='%2322d3ee'/%3E%3C/svg%3E"
  />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/animations.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>

<body data-bg="on">
  <a class="skip-link" href="#viewHost">Skip to House control</a>

  <!-- ── Background visual stack ────────────────────────────────────── -->
  <canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-layer bg-glow" aria-hidden="true"></div>
  <div class="bg-layer bg-scanlines" aria-hidden="true"></div>
  <div class="bg-layer bg-noise" aria-hidden="true"></div>
  <div class="bg-layer bg-sweep" aria-hidden="true"></div>
  <div class="bg-layer bg-vignette" aria-hidden="true"></div>

  <!-- ── App shell ──────────────────────────────────────────────────── -->
  <div class="app" id="app" data-sidebar="expanded">
    <aside class="sidebar" id="sidebar" aria-label="Command Center navigation"></aside>

    <main class="main" id="main">
      <div id="header"></div>

      <div class="view-host" id="viewHost">
        <!-- First-paint skeleton (replaced on boot, prevents layout shift) -->
        <section class="view is-active">
          <div class="skeleton-grid">
            <div class="skeleton skeleton--stat"></div>
            <div class="skeleton skeleton--stat"></div>
            <div class="skeleton skeleton--stat"></div>
            <div class="skeleton skeleton--stat"></div>
            <div class="skeleton skeleton--stat"></div>
            <div class="skeleton skeleton--stat"></div>
          </div>
          <div class="skeleton-grid skeleton-grid--stack">
            <div class="skeleton skeleton--row"></div>
            <div class="skeleton skeleton--row"></div>
            <div class="skeleton skeleton--row"></div>
            <div class="skeleton skeleton--row"></div>
          </div>
        </section>
      </div>

      <footer class="app-footer">
        <span class="row-8">
          <i class="live-dot"></i>
          <span class="fs-xs muted">Surveillance live · Tech House feed encrypted</span>
        </span>
        <span class="spacer"></span>
        <span class="fs-xs muted">Big Boss Command Center v2.0 · Big Boss is watching.</span>
      </footer>
    </main>
  </div>

  <!-- ── Overlays ───────────────────────────────────────────────────── -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal__card glass">
      <div class="modal__head">
        <h2 class="modal__title" id="modalTitle">Title</h2>
        <p class="modal__desc" id="modalDesc"></p>
      </div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="banner" id="banner" role="alertdialog" aria-modal="true" aria-labelledby="bannerText" aria-hidden="true">
    <span class="banner__scan" aria-hidden="true"></span>
    <div class="banner__card" id="bannerCard" data-tone="accent">
      <button class="btn btn--icon btn--ghost banner__close" id="bannerClose" type="button" aria-label="Dismiss announcement">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" /></svg>
      </button>

      <div class="banner__eye" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </div>

      <div class="banner__body">
        <div class="banner__tag" id="bannerTag">Big Boss · Announcement</div>
        <p class="banner__text" id="bannerText"></p>
        <div class="banner__foot">
          <span class="chip chip--live">House-wide broadcast</span>
          <span>Transmitted <span id="bannerStamp">--:--:--</span></span>
        </div>
      </div>

      <span class="banner__progress" id="bannerProgress" aria-hidden="true"></span>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <p style="padding: 24px; color: #e8eefc">
      The Command Center needs JavaScript enabled to monitor the Tech House.
    </p>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
